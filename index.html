<style>
/* 시험실 화면 : 휴대폰 한 열, 위 = 진행 막대, 가운데 = 질문 카드, 아래 = 큰 버튼 */
:root{
  --bg:#eef1f4; --card:#ffffff; --fg:#14202b; --mute:#5a6876; --line:#d5dce3; --soft:#e4e9ef;
  --accent:#1d4f91; --accent-fg:#ffffff; --ok:#1b7a45; --warn:#9a6a00; --bad:#b0352a;
  --f:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --fe:"Segoe UI",Roboto,"Helvetica Neue",Arial,var(--f);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c; --card:#19222b; --fg:#e5ebf1; --mute:#97a5b3; --line:#2c3843; --soft:#222d37;
  --accent:#7eaef0; --accent-fg:#0d1620; --ok:#5ec68b; --warn:#e2b84f; --bad:#f08b80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --card:#19222b; --fg:#e5ebf1; --mute:#97a5b3; --line:#2c3843; --soft:#222d37;
  --accent:#7eaef0; --accent-fg:#0d1620; --ok:#5ec68b; --warn:#e2b84f; --bad:#f08b80; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f);line-height:1.55;font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
main{max-width:600px;margin:0 auto;display:grid;gap:12px}
h1{font-size:1.2rem;margin:0}
h2{font-size:1.02rem;margin:0}
h3{font-size:.95rem;margin:0}
p{margin:0}
.mute{color:var(--mute)} .sm{font-size:.85rem} .xs{font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button{font:inherit;cursor:pointer}
.btn{padding:12px 14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:1rem}
.btn.sec{background:var(--card);color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mute);font-weight:400;font-size:.9rem;padding:9px 12px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:.88rem;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.pill{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--warn)} .pill.ok{color:var(--ok)} .pill.mute{color:var(--mute)}
.phase{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.phase div{font-size:.72rem;text-align:center;padding:5px 2px;border-radius:6px;background:var(--soft);color:var(--mute)}
.phase div.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.big{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.qcard{display:grid;gap:14px;justify-items:center;text-align:center;padding:22px 16px}
.ring{width:132px;height:132px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--soft)}
.ring.play{border-color:var(--accent)}
.ring.ans{border-color:var(--ok)}
.state{font-size:.95rem;font-weight:600}
.meter{width:100%;display:grid;gap:4px}
.bar{position:relative;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--warn);border-radius:99px}
.bar i.ih{background:var(--accent)} .bar i.al{background:var(--ok)}
.ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mute);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--fe);text-align:left;font-size:1rem;line-height:1.5;background:var(--soft);border-radius:8px;padding:10px 12px}
.hint{text-align:left;font-size:.88rem;border-left:3px solid var(--warn);padding:4px 10px;color:var(--fg)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.surv{display:grid;gap:12px}
.surv h3{font-size:.85rem;color:var(--mute);font-weight:600}
.list{display:grid;gap:8px}
.item{display:grid;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);width:100%}
.item .top{font-weight:600}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.kv b{color:var(--fg);font-weight:600}
.sc{display:flex;flex-wrap:wrap;gap:6px}
.sc span{font-size:.78rem;padding:2px 8px;border-radius:6px;background:var(--soft)}
.sc .o{color:var(--ok)} .sc .t{color:var(--warn)} .sc .x{color:var(--bad)}
.tr{font-family:var(--fe);font-size:.92rem;line-height:1.6;background:var(--soft);border-radius:8px;padding:10px 12px}
.tr mark{background:transparent;color:var(--bad);text-decoration:underline wavy;text-underline-offset:3px}
.fix{display:grid;gap:6px;font-family:var(--fe);font-size:.9rem}
.fix div{display:grid;gap:2px;border-left:3px solid var(--line);padding-left:10px}
.fix s{color:var(--mute)} .fix span{color:var(--ok)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{display:grid;gap:4px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .v{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tbl td.n{text-align:right}
.wrap{overflow-x:auto}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
.warnbox{border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem}
details summary{cursor:pointer;color:var(--accent);font-size:.9rem}
@media (max-width:380px){.charts{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const BANK = {"topics":[{"code":"self","kind":"self","name":"자기소개"},{"code":"work","kind":"survey","name":"직장"},{"code":"home","kind":"survey","name":"집·동네"},{"code":"movies","kind":"survey","name":"영화 보기"},{"code":"park","kind":"survey","name":"공원 가기"},{"code":"cafe","kind":"survey","name":"카페 가기"},{"code":"beach","kind":"survey","name":"해변 가기"},{"code":"concert","kind":"survey","name":"공연·콘서트 보기"},{"code":"shopping","kind":"survey","name":"쇼핑하기"},{"code":"music","kind":"survey","name":"음악 감상"},{"code":"walking","kind":"survey","name":"걷기·조깅"},{"code":"domtravel","kind":"survey","name":"국내 여행"},{"code":"ovtravel","kind":"survey","name":"해외 여행"},{"code":"homevac","kind":"survey","name":"집에서 보내는 휴가"},{"code":"geography","kind":"unexp","name":"지형·자연"},{"code":"technology","kind":"unexp","name":"산업·기술"},{"code":"weather","kind":"unexp","name":"날씨·계절"},{"code":"fashion","kind":"unexp","name":"패션"},{"code":"recycling","kind":"unexp","name":"재활용"},{"code":"bank","kind":"unexp","name":"은행"},{"code":"hotel","kind":"unexp","name":"호텔"},{"code":"hospital","kind":"unexp","name":"병원·건강"},{"code":"transport","kind":"unexp","name":"교통수단"},{"code":"phone","kind":"unexp","name":"휴대폰·전화"},{"code":"furniture","kind":"unexp","name":"가구"},{"code":"restaurant","kind":"unexp","name":"외식·배달"},{"code":"internet","kind":"unexp","name":"인터넷"},{"code":"holiday","kind":"unexp","name":"명절·기념일"},{"code":"gathering","kind":"unexp","name":"모임·약속"},{"code":"library","kind":"unexp","name":"도서관"},{"code":"rp_movie","kind":"rp","name":"영화표 예매"},{"code":"rp_hotel","kind":"rp","name":"호텔 예약"},{"code":"rp_bank","kind":"rp","name":"은행 계좌"},{"code":"rp_furniture","kind":"rp","name":"가구 구매"},{"code":"rp_travel","kind":"rp","name":"여행 계획"},{"code":"rp_phone","kind":"rp","name":"휴대폰 수리"},{"code":"rp_restaurant","kind":"rp","name":"식당 예약"},{"code":"rp_gym","kind":"rp","name":"운동 시설 등록"},{"code":"rp_concert","kind":"rp","name":"공연 표"},{"code":"rp_work","kind":"rp","name":"업무 상황"}],"qs":[{"id":"self-I1","topic":"self","type":"I","text":"Let's start the interview now. Tell me something about yourself.","hint":""},{"id":"work-D1","topic":"work","type":"D","text":"You indicated in the survey that you work at a company. Tell me about your office. Where is it, what does it look like, and who do you work with?","hint":""},{"id":"work-D2","topic":"work","type":"D","text":"Describe the kind of work you do. What are your main responsibilities, and what does a project usually look like from start to finish?","hint":""},{"id":"work-R1","topic":"work","type":"R","text":"Walk me through a typical workday. What do you do when you first get to the office, and how does your day usually end?","hint":""},{"id":"work-R2","topic":"work","type":"R","text":"How do you usually prepare for an important meeting or presentation at work? Tell me about the steps you go through.","hint":""},{"id":"work-P1","topic":"work","type":"P","text":"Tell me about a time when you faced a serious problem at work. What happened, how did you handle it, and what was the result?","hint":""},{"id":"work-P2","topic":"work","type":"P","text":"Tell me about a project you are proud of. How did it start, what did you do, and how did it turn out?","hint":""},{"id":"work-P3","topic":"work","type":"P","text":"Describe a memorable experience you had with a coworker or manager. What happened, and why do you still remember it?","hint":""},{"id":"work-C1","topic":"work","type":"C","text":"How has the way people work changed compared to when you first started your career? Talk about technology, communication, or anything else that has changed.","hint":""},{"id":"work-S1","topic":"work","type":"S","text":"Many companies now use AI tools at work. What are some concerns people have about this, and how do you think companies should deal with them?","hint":""},{"id":"home-D1","topic":"home","type":"D","text":"You indicated that you live in a house or an apartment. Describe your home to me. What does it look like, and which room do you like the most?","hint":"구조 → 좋아하는 방 → 이유"},{"id":"home-D2","topic":"home","type":"D","text":"Tell me about the neighborhood where you live. What kinds of places are around your home, and what are the people like?","hint":""},{"id":"home-R1","topic":"home","type":"R","text":"What do you usually do at home on weekdays and on weekends? Describe your routine in detail.","hint":""},{"id":"home-R2","topic":"home","type":"R","text":"Who in your family does the housework, and how do you divide the chores? Tell me about a typical cleaning day.","hint":""},{"id":"home-P1","topic":"home","type":"P","text":"Have you ever changed something in your home, such as moving furniture or redecorating a room? Tell me what you did and why.","hint":""},{"id":"home-P2","topic":"home","type":"P","text":"Tell me about a memorable thing that happened in your home. When was it, who was there, and what happened?","hint":""},{"id":"home-C1","topic":"home","type":"C","text":"Compare the home you live in now with a home you lived in when you were younger. What are the differences?","hint":""},{"id":"home-S1","topic":"home","type":"S","text":"Housing prices are a big issue in many countries. What problems do people in your country face when looking for a place to live?","hint":""},{"id":"movies-D1","topic":"movies","type":"D","text":"You indicated that you like watching movies. What kinds of movies do you like, and why do you enjoy them?","hint":""},{"id":"movies-D2","topic":"movies","type":"D","text":"Tell me about a movie theater you often go to. Where is it, and what does it look like inside?","hint":""},{"id":"movies-R1","topic":"movies","type":"R","text":"What do you usually do before and after watching a movie? Walk me through a typical movie day.","hint":""},{"id":"movies-P1","topic":"movies","type":"P","text":"Tell me about the most memorable movie you have seen recently. What was it about, and why did it stay with you?","hint":""},{"id":"movies-P2","topic":"movies","type":"P","text":"Have you ever had an unexpected or funny experience at a movie theater? Tell me what happened from beginning to end.","hint":""},{"id":"movies-C1","topic":"movies","type":"C","text":"How have the movies you like changed over the years? Compare the movies you enjoyed in the past with the ones you like now.","hint":""},{"id":"movies-S1","topic":"movies","type":"S","text":"These days many people watch movies on streaming services instead of going to theaters. How has this changed the movie industry?","hint":""},{"id":"park-D1","topic":"park","type":"D","text":"You indicated that you go to parks. Describe a park you often visit. What does it look like, and what can people do there?","hint":""},{"id":"park-R1","topic":"park","type":"R","text":"What do you usually do when you go to the park? Who do you go with, and how often do you go?","hint":""},{"id":"park-P1","topic":"park","type":"P","text":"Tell me about a memorable experience you had at a park. When was it, and what happened?","hint":""},{"id":"park-P2","topic":"park","type":"P","text":"Tell me about the first time you visited the park you like. How did you find it, and what was your first impression?","hint":""},{"id":"park-C1","topic":"park","type":"C","text":"How have parks in your city changed over the years? Compare parks from your childhood with parks today.","hint":""},{"id":"park-S1","topic":"park","type":"S","text":"What are some problems people complain about at parks, such as noise, trash, or crowds? How should cities handle them?","hint":""},{"id":"cafe-D1","topic":"cafe","type":"D","text":"You indicated that you go to cafes. Tell me about a cafe you like. Where is it, and what makes it special?","hint":""},{"id":"cafe-R1","topic":"cafe","type":"R","text":"What do you usually do at a cafe? Do you go there to work, to meet people, or to relax? Describe a typical visit.","hint":""},{"id":"cafe-P1","topic":"cafe","type":"P","text":"Tell me about a memorable experience you had at a cafe. What happened, and who were you with?","hint":""},{"id":"cafe-C1","topic":"cafe","type":"C","text":"How have cafes changed in your country over the past ten years? Talk about the menu, the design, or the way people use them.","hint":""},{"id":"cafe-S1","topic":"cafe","type":"S","text":"Some cafes now limit how long customers can stay or ban laptops. What do you think about this trend?","hint":""},{"id":"beach-D1","topic":"beach","type":"D","text":"You indicated that you like going to the beach. Describe a beach you have been to. What does it look like?","hint":""},{"id":"beach-R1","topic":"beach","type":"R","text":"What do you usually do when you go to the beach? How do you prepare for the trip?","hint":""},{"id":"beach-P1","topic":"beach","type":"P","text":"Tell me about a memorable trip to the beach. What happened during that trip?","hint":""},{"id":"beach-C1","topic":"beach","type":"C","text":"How have popular beaches in your country changed compared to the past?","hint":""},{"id":"concert-D1","topic":"concert","type":"D","text":"You indicated that you go to concerts. What kinds of concerts or performances do you like, and where do you usually go to see them?","hint":""},{"id":"concert-R1","topic":"concert","type":"R","text":"What do you usually do on the day of a concert? Describe everything from getting tickets to going home.","hint":""},{"id":"concert-P1","topic":"concert","type":"P","text":"Tell me about the most memorable concert or performance you have been to. What made it special?","hint":""},{"id":"concert-C1","topic":"concert","type":"C","text":"How have concerts changed compared to the past? Think about ticket prices, technology, or the audience.","hint":""},{"id":"shopping-D1","topic":"shopping","type":"D","text":"You indicated that you enjoy shopping. Tell me about a store or shopping area you like to visit.","hint":""},{"id":"shopping-R1","topic":"shopping","type":"R","text":"How do you usually shop? Do you make a list, compare prices, or shop online? Describe your habits.","hint":""},{"id":"shopping-P1","topic":"shopping","type":"P","text":"Tell me about a memorable shopping experience, good or bad. What did you buy, and what happened?","hint":""},{"id":"shopping-C1","topic":"shopping","type":"C","text":"Compare shopping in stores with shopping online. How has the way you shop changed over the years?","hint":""},{"id":"music-D1","topic":"music","type":"D","text":"You indicated that you listen to music. What kind of music do you like, and who are your favorite singers or musicians?","hint":""},{"id":"music-R1","topic":"music","type":"R","text":"When and where do you usually listen to music? What devices or apps do you use?","hint":""},{"id":"music-P1","topic":"music","type":"P","text":"Tell me about how you first became interested in music. When was it, and what happened?","hint":""},{"id":"music-P2","topic":"music","type":"P","text":"Tell me about a time when a song had a special meaning for you. What was going on in your life at that time?","hint":""},{"id":"music-C1","topic":"music","type":"C","text":"How has the way people listen to music changed? Compare the past with today.","hint":""},{"id":"music-S1","topic":"music","type":"S","text":"Musicians often say they earn very little from streaming. What do you think about this issue?","hint":""},{"id":"walking-D1","topic":"walking","type":"D","text":"You indicated that you go walking or jogging. Where do you usually go, and what is that place like?","hint":""},{"id":"walking-R1","topic":"walking","type":"R","text":"Describe your walking or jogging routine. When do you go, how long do you exercise, and what do you do before and after?","hint":""},{"id":"walking-P1","topic":"walking","type":"P","text":"Tell me about how you started walking or jogging. Why did you begin, and how has it helped you?","hint":""},{"id":"walking-P2","topic":"walking","type":"P","text":"Have you ever had an unexpected problem while walking or jogging, like bad weather or an injury? What happened?","hint":""} function compose(mode) {
  const used = new Set(), sv = shuffle(surveyTopics()), ux = shuffle(unexpTopics());
  let items = [], pool = [];
  if (mode === "full") {
    items.push(pickQ("self", "I", used));
    items.push(...seq(sv[0] || ux.shift(), ["D", "R", "P"], used));
    const B = sv[1] && Math.random() < 0.6 ? sv[1] : ux.shift();
    items.push(...seq(B, ["D", "P", "C"], used));
    items.push(...seq(ux.shift(), ["D", "P", "C"], used));
    items.push(...seq(rnd(rpTopics()), ["RA", "RB", "RC"], used));
    pool = [...ux, ...sv.slice(2)];
  } else if (mode === "combo") {
    const [, types] = COMBOS[S.combo];
    const cand = S.combo === "survey" ? sv : S.combo === "unexp" ? ux : S.combo === "rp" ? shuffle(rpTopics()) : shuffle([...ux, ...sv]).filter(t => has(t, "S"));

    items = [pickQ(cand[0], t, used)];

}

  const used = new Set(RUN.used), hard = level2 !== "easy" && RUN.level >= 5;
  const cand = RUN.pool.filter(t => hard ? has(t, "S") : true);

  else if (act === "opt") {
    const o = OPT[v], g = SURVEY.find(x => x.cat === o.cat), on = S.keys.includes(v);
    if (g.one) { S.keys = S.keys.filter(k => OPT[k].cat !== o.cat); S.keys.push(v); }
    else S.keys = on ? S.keys.filter(k => k !== v) : [...S.keys, v];
    S.preset = Object.keys(PRESETS).find(p => PRESETS[p].keys.slice().sort().join() === S.keys.slice().sort().join()) || "custom";
    saveS(); render();
  }
  else if (act === "level") { S.level = +v; saveS(); render(); }
  else if (act === "toggle") { S[v] = !S[v]; saveS(); render(); }
  else if (act === "combo") { S.combo = v; saveS(); render(); }
  else if (act === "focus") { S.focus = v; saveS(); render(); }
  else if (act === "play") play(false);
  else if (act === "replay") play(true);
  else if (act === "next") { confirmQuit = false; next(); }
  else if (act === "level2") { addTail(v); RUN.phase = "q"; RUN.i++; saveRun(); view = "q"; play(false); }
  else if (act === "quit") {
    if (!confirmQuit) { confirmQuit = true; b.textContent = "한 번 더 누르면 그만둡니다 (기록 안 남김)"; return; }
    confirmQuit = false; stopVoice(); const id = RUN.id; RUN = null; saveRun(); releaseWake(); view = "home";
    if (PWA) recStop().then(() => dropChunks(id));
    render();
  }
  else if (act === "endhome") { RUN = null; saveRun(); view = "home"; render(); }
  else if (act === "detail") { detailId = v; view = "detail"; render(); window.scrollTo(0, 0); }
});

/* ---------- 시작 ---------- */
if (PWA) {
  if (window.speechSynthesis) {
    pickVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); if (!["q", "reselect"].includes(view)) render(); };
    setTimeout(() => { voicesReady = true; pickVoice(); if (!["q", "reselect"].includes(view)) render(); }, 2500);
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  (async () => {
    if (RUN && RUN.phase === "done") { try { lastPacked = await packRun(RUN); } catch (e) {} RUN = null; saveRun(); }
    await loadBox(); render();
  })();
} else if (RUN && RUN.phase === "done") { pending(toSet(RUN)); RUN = null; saveRun(); }
render();
if (!PWA) (async () => {
  const c = window.claude;
  if (!c || !c.use) { dbState = "claude.ai 밖 → 이 기기에만 보관"; return render(); }
  db = await c.use("db");
  if (!db) { dbState = "연결 안 됨 → 이 기기에만 보관"; return render(); }
  dbState = "연결됨";
  await syncPending();
  let timer = setTimeout(() => { dbState = "기록 불러오기 지연"; if (!["q", "reselect"].includes(view)) render(); }, 10000);
  db.collection("sets").onSnapshot(snap => {
    clearTimeout(timer);
    SETS = snap.docs.map(d => d.data()).filter(Boolean).sort((a, b) => String(b.id).localeCompare(String(a.id)));
    if (!["q", "reselect"].includes(view)) render();
  }, err => { clearTimeout(timer); dbState = "불러오기 실패 : " + (err.code || err.message); if (!["q", "reselect"].includes(view)) render(); });
})();
</script>
